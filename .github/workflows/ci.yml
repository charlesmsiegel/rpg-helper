name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 to build, 17 to emit. Float16Test checks the hand-written codec against
          # java.lang.Float.float16ToFloat, which arrived in JDK 20 -- while the module
          # itself targets 17 bytecode so it stays loadable on Android.
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :pack:test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: pack/build/reports/tests/test
