[versions]
kotlin = "2.2.0"
# Bundles its own SQLite (3.50.3) built with FTS5 and bm25() enabled, which the pack
# format requires. The platform's SQLite is not an option on the device side either --
# see docs/pack-schema.md, "SQLite on the device".
sqlite-jdbc = "3.50.3.0"
# llama.cpp via JNI. Ships native libraries for Linux x86-64/aarch64, macOS, Windows and
# Android arm64 -- which is why one runtime module can serve the CLI and, later, the phone.
llama = "4.2.0"
# Runtime-only: constraint `args` is JSON, parsed to JsonElement. No compiler plugin.
kotlinx-serialization = "1.9.0"
# The Android Gradle Plugin and Compose. Kept to versions that pair with Kotlin 2.2:
# Compose's compiler ships inside the Kotlin plugin from 2.0 on, so there is no separate
# compiler-extension version to keep in step -- which was the usual source of drift.
agp = "8.7.3"
compose-bom = "2024.12.01"
androidx-activity = "1.9.3"
androidx-lifecycle = "2.8.7"
# Robolectric runs the Android framework on the JVM, which is what lets `:app` have tests
# at all in an environment with no device. Compose's own test rule drives composition and
# reads the semantics tree -- the same tree TalkBack reads, which is why an assertion here
# is an assertion about what a screen-reader user is told.
robolectric = "4.14.1"

[libraries]
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
llama = { module = "de.kherud:llama", version.ref = "llama" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
